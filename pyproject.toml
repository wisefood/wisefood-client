[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisefood"
version = "0.0.22"
description = "A small client for accessing and managing resources in the WiseFood platform."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "dpetrou", email = "dpetrou@athenarc.gr" }
]
requires-python = ">=3.8"
dependencies = ["requests>=2.28", "pandas"]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[project.urls]
Homepage = "https://github.com/wisefood/wisefood-client"
Issues = "https://github.com/wisefood/wisefood-client/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["data*", "tests*", "examples*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.ipynb"]